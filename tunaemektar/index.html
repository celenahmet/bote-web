<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Futbol Algoritma Oyunu · Ekran Görüntüleri</title>
  <meta name="description" content="Futbol Algoritma Oyunu ekran görüntüleri: bölüm girişi, oyun alanı, gol ekranı ve oynanış göstergeleri.">
  <!-- Ders sunumu sayfası: arama sonuçlarında çıkması amaçlanmıyor. -->
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#0b1120">
  <link rel="stylesheet" href="/tunaemektar/galeri.css">
</head>
<body>
  <header class="ust">
    <div>
      <p class="ust-etiket">Ekran görüntüleri</p>
      <h1>Futbol Algoritma Oyunu</h1>
      <p class="ust-alt">Görsele dokun ya da tıkla: büyüt, yakınlaştır, kaydır. Sunum için tam ekran modu var.</p>
    </div>
    <button type="button" class="sunum-dugmesi" id="sunumBaslat">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
      Sunumu başlat
    </button>
  </header>

  <main>
    <ul class="izgara" id="izgara">
      <li><button type="button" class="kart genis" data-i="0"><img src="/tunaemektar/kucuk/01.webp" alt="Bölüm girişi: İlk Pas ve Kanat Genişliği" width="640" height="304"><span>Bölüm girişi</span></button></li>
      <li><button type="button" class="kart genis" data-i="1"><img src="/tunaemektar/kucuk/02.webp" alt="Oyun alanı: oyuncular, savunmacılar ve pas yolu" width="640" height="303" loading="lazy"><span>Oyun alanı 1</span></button></li>
      <li><button type="button" class="kart genis" data-i="2"><img src="/tunaemektar/kucuk/03.webp" alt="Oyun alanı: topun kaleye ilerleyişi" width="640" height="304" loading="lazy"><span>Oyun alanı 2</span></button></li>
      <li><button type="button" class="kart genis" data-i="3"><img src="/tunaemektar/kucuk/04.webp" alt="Oyun alanı: oyuncu ve kale konumları" width="640" height="303" loading="lazy"><span>Oyun alanı 3</span></button></li>
      <li><button type="button" class="kart genis" data-i="4"><img src="/tunaemektar/kucuk/05.webp" alt="Gol ekranı: kazanılan puan ve hamle sayısı" width="640" height="304" loading="lazy"><span>Gol ekranı</span></button></li>
      <li><button type="button" class="kart dikey" data-i="5"><img src="/tunaemektar/kucuk/06.webp" alt="Göstergeler paneli" width="257" height="640" loading="lazy"><span>Göstergeler</span></button></li>
      <li><button type="button" class="kart dikey" data-i="6"><img src="/tunaemektar/kucuk/07.webp" alt="Nasıl oynanır paneli" width="302" height="582" loading="lazy"><span>Nasıl oynanır</span></button></li>
    </ul>
  </main>

  <footer class="alt">bote.web.tr</footer>

  <div class="gosterici" id="gosterici" role="dialog" aria-modal="true" aria-label="Görsel gösterici" hidden>
    <div class="sahne" id="sahne">
      <img id="buyukGorsel" alt="" draggable="false">
    </div>
    <div class="arac-ust">
      <span class="sayac" id="sayac">1 / 7</span>
      <span class="baslik" id="baslik"></span>
      <div class="arac-grup">
        <button type="button" id="uzaklas" aria-label="Uzaklaştır" title="Uzaklaştır (−)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11h14v2H5z"/></svg></button>
        <button type="button" id="sifirla" class="yuzde" aria-label="Yakınlaştırmayı sıfırla" title="Sıfırla (0)">100%</button>
        <button type="button" id="yakinlas" aria-label="Yakınlaştır" title="Yakınlaştır (+)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M11 5h2v6h6v2h-6v6h-2v-6H5v-2h6z"/></svg></button>
        <button type="button" id="tamEkran" aria-label="Tam ekran" title="Tam ekran (F)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h6v2H6v4H4zm10 0h6v6h-2V6h-4zM4 14h2v4h4v2H4zm14 0h2v6h-6v-2h4z"/></svg></button>
        <button type="button" id="kapat" aria-label="Kapat" title="Kapat (Esc)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6l5.6-5.6L5 6.4z"/></svg></button>
      </div>
    </div>
    <button type="button" class="gezinme onceki" id="onceki" aria-label="Önceki görsel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.4 5 8.4 12l7 7 1.4-1.4L11.2 12l5.6-5.6z"/></svg></button>
    <button type="button" class="gezinme sonraki" id="sonraki" aria-label="Sonraki görsel"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m8.6 5-1.4 1.4 5.6 5.6-5.6 5.6L8.6 19l7-7z"/></svg></button>
    <div class="ipucu" id="ipucu">← → geçiş · tekerlek ya da iki parmak yakınlaştırma · çift tık büyüt · Esc kapat</div>
  </div>

  <script src="/tunaemektar/galeri.js" defer></script>
</body>
</html>
