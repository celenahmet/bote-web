# BÖTE Blog ayarlari. Uretici: cd tools && npm run blog
siteUrl: https://www.bote.web.tr
title: BÖTE Blog
tagline: Bilgisayar ve Öğretim Teknolojileri Eğitimi bölümü, eğitim fakülteleri ve öğretmenlik üzerine yazılar
description: >-
  Bilgisayar ve Öğretim Teknolojileri Eğitimi (BÖTE) bölümü, eğitim fakülteleri,
  öğretmenliğe giden yol ve eğitim teknolojileri üzerine rehber yazılar.
perPage: 12

# Yazar imzasi (E-E-A-T): profil ve yayin ilkeleri /blog/editor-ekibi sayfasinda.
author:
  name: BÖTE Editör Ekibi
  slug: editor-ekibi

# Yazi zorunlulugu: en az bu kadar yabanci (lang != tr) kaynak.
minForeignSources: 2
# Her yazida tam bu kadar SSS; sorular arama niyetine (Trends / Search Console) gore secilir.
faqCount: 6

categories:
  - slug: bolum-rehberi
    icon: compass
    name: Bölüm Rehberi
    description: BÖTE bölümünü tanımak isteyen aday öğrenciler ve veliler için bölümün yapısı, dersleri ve kazanımları.
  - slug: kariyer
    icon: briefcase
    name: Kariyer
    description: BÖTE mezunlarının çalışma alanları, öğretmenlik ve öğretmenlik dışı kariyer yolları.
  - slug: yuksekogretim
    icon: landmark
    name: Yükseköğretim ve Politika
    description: YÖK kararları, kontenjanlar ve öğretmen yetiştirme politikalarına dair gelişmeler.
  - slug: egitim-fakultesi
    icon: graduation-cap
    name: Eğitim Fakültesi
    description: Eğitim fakültelerinin yapısı, bölümleri ve öğretmen yetiştirme sistemi.
  - slug: egitim-teknolojileri
    icon: monitor-cog
    name: Eğitim Teknolojileri
    description: Öğretim teknolojileri, dijital yetkinlikler ve eğitimde yapay zekâ üzerine yazılar.

# Reklam alanlari. adsense.client doldurulursa (ca-pub-...) ilgili alanlarda AdSense
# gosterilir ve kok dizine ads.txt uretilir; bos ise site ici tanitim (house) gosterilir.
ads:
  adsense:
    client: ""
    slots:
      sidebar-top: ""
      sidebar-bottom: ""
      article-end: ""
  # Site ici tanitim (AdSense yokken). Kart: logo, tek cumlelik tanim, CTA ve magaza rozetleri.
  house:
    - id: uniconnectly
      slots: [sidebar-top, article-end]
      brand: UniConnectly
      # Logo: tam adres ya da tools/blog-app/public/ads/ altindaki dosya (/blog/ads/...).
      # Gecici olarak uniconnectly.com'daki logo kullaniliyor.
      logo: https://uniconnectly.com/brand/light-logo-navbar.avif
      text: >-
        Üniversite topluluklarını, etkinlikleri ve şirketleri tek uygulamada
        buluşturan ücretsiz kampüs platformu.
      cta: Ücretsiz keşfet
      url: https://uniconnectly.com/?utm_source=bote.web.tr&utm_medium=banner&utm_campaign=blog
      # Magaza sayfalarinin adresleri gelince url alanlari guncellenir (simdilik site).
      stores:
        - id: appstore
          url: https://uniconnectly.com/?utm_source=bote.web.tr&utm_medium=banner&utm_campaign=blog&utm_content=appstore
        - id: googleplay
          url: https://uniconnectly.com/?utm_source=bote.web.tr&utm_medium=banner&utm_campaign=blog&utm_content=googleplay
        - id: appgallery
          url: https://uniconnectly.com/?utm_source=bote.web.tr&utm_medium=banner&utm_campaign=blog&utm_content=appgallery
