<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="/assets/img/educator-fabicon-300x300.png" type="image/png">
    <title>BÖTE : 404 Not Found</title>
    <meta name="robots" content="noindex,nofollow">
    <meta name="description" content="Aradığınız sayfa bulunamadı.">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="BÖTE">
    <meta property="og:locale" content="tr_TR">
    <meta property="og:title" content="BÖTE : 404 Not Found">
    <meta property="og:url" content="https://www.bote.web.tr/404">
    <meta property="og:image" content="https://www.bote.web.tr/assets/img/educator-img14.jpg">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="BÖTE : 404 Not Found">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;800&family=Poppins:wght@500;700&display=swap">
    <!--
      Kendi kendine yeten hata sayfasi: eski surum /error/404/assets altindaki
      ~7 MB'lik vendor CSS yiginini (bootstrap, fontawesome, slick, jquery-ui...)
      yukluyordu. Tek dosya, dis bagimliliksiz; /error/ klasoru artik yayina
      cikmiyor (.vercelignore).
    -->
    <style>
        :root { --mor: #41246D; --pembe: #F24080; --metin: #414141; --zemin: #ffffff; }
        * { box-sizing: border-box; }
        body { margin: 0; font-family: Mulish, system-ui, -apple-system, "Segoe UI", sans-serif; color: var(--metin); background: var(--zemin); }
        .kutu { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 48px 20px; gap: 18px; }
        .logo { width: 180px; height: auto; }
        .kod { font-family: Poppins, Mulish, sans-serif; font-size: clamp(64px, 18vw, 140px); font-weight: 700; line-height: 1; color: var(--mor); margin: 0; }
        h1 { font-family: Poppins, Mulish, sans-serif; font-size: clamp(22px, 5vw, 30px); font-weight: 700; margin: 0; color: #111111; }
        p { max-width: 52ch; margin: 0; font-size: 16px; line-height: 1.6; }
        .baglantilar { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 8px; }
        a.dugme { display: inline-block; padding: 12px 24px; border-radius: 999px; font-weight: 700; text-decoration: none; font-size: 15px; }
        a.birincil { background: var(--mor); color: #ffffff; }
        a.birincil:hover { background: #2f1a50; }
        a.ikincil { border: 2px solid var(--pembe); color: var(--pembe); }
        a.ikincil:hover { background: var(--pembe); color: #ffffff; }
        .alt { font-size: 14px; color: #6b6b6b; }
        .alt a { color: var(--mor); }
        @media (prefers-color-scheme: dark) {
            :root { --zemin: #111111; --metin: #d8d8d8; }
            h1 { color: #ffffff; }
            .kod { color: #b79bea; }
            a.birincil { background: #b79bea; color: #111111; }
            .alt { color: #9a9a9a; }
            .alt a { color: #b79bea; }
        }
    </style>
</head>

<body>
    <main class="kutu">
        <a href="/"><img class="logo" src="/assets/img/educator-logo1.png" width="180" height="50" alt="BÖTE"></a>
        <p class="kod">404</p>
        <h1>Sayfa bulunamadı</h1>
        <p>Aradığınız sayfa taşınmış ya da adresi değişmiş olabilir. Aşağıdan ana sayfaya dönebilir veya bölüm sayfalarına göz atabilirsiniz.</p>
        <div class="baglantilar">
            <a class="dugme birincil" href="/">Ana sayfa</a>
            <a class="dugme ikincil" href="/curriculum">Ders programı</a>
            <a class="dugme ikincil" href="/contact">İletişim</a>
        </div>
        <p class="alt">Bir bağlantının kırık olduğunu düşünüyorsanız <a href="mailto:ahmetcelen@hacettepe.edu.tr">ahmetcelen@hacettepe.edu.tr</a> adresine yazabilirsiniz.</p>
    </main>
</body>

</html>
